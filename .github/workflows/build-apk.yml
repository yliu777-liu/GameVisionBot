name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Unpack Android source
        run: unzip -q GameVisionBotSource_v0.3.zip -d source

      - name: Build debug APK
        working-directory: source/GameVisionBot
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Prepare artifact
        run: cp source/GameVisionBot/app/build/outputs/apk/debug/app-debug.apk GameVisionBot-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GameVisionBot-debug-apk
          path: GameVisionBot-debug.apk
          if-no-files-found: error
          retention-days: 30
