name: Build GameVisionBot APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Android project
        shell: bash
        run: |
          cat > /tmp/gamevisionbot.b64 <<'B64EOF'




RAGI0YD39DQyjmNVJTJYadQDHmUR/G9Plhw/nqfbRIqWmfm5iABLXGbdjdxJqALlBrvUtiCb5RZJ9Kigs68GoRFjIN2Q6lgMlaIq2Tw7bz0RfOg43u/afgw6OXnztff9rZ








B64EOF
          base64 -d /tmp/gamevisionbot.b64 > /tmp/GameVisionBotSource.zip
          rm -rf /tmp/gvb-src
          mkdir -p /tmp/gvb-src
          unzip -q /tmp/GameVisionBotSource.zip -d /tmp/gvb-src

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        working-directory: /tmp/gvb-src/GameVisionBotStarter
        run: gradle --no-daemon assembleDebug

      - name: Copy APK
        shell: bash
        run: cp /tmp/gvb-src/GameVisionBotStarter/app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/GameVisionBot-v0.2-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameVisionBot-v0.2-debug
          path: GameVisionBot-v0.2-debug.apk
          if-no-files-found: error
